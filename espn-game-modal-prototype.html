<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeagueWeaver — Game Detail Prototype</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2230;--line:#2a3140;--txt:#e6edf3;--dim:#8b98a9;--green:#3fb950;--gold:#e3b341;--red:#f0616d;--accent:#388bfd}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px;max-width:760px;margin:0 auto}
h1{font-size:19px;letter-spacing:.2px}.sub{color:var(--dim);font-size:12.5px;margin:2px 0 18px}
.games{display:grid;gap:10px}
.game{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s}
.game:hover{border-color:var(--accent);transform:translateY(-1px)}
.g-side{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.g-side.away{justify-content:flex-end;text-align:right}
.g-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-owner{color:var(--dim);font-size:11px}
.g-score{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.win{color:var(--green)}.mid{color:var(--dim);font-size:12px;padding:0 4px}
.tag{color:var(--dim);font-size:11px;margin-left:auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:10}
.ov.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:720px;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;padding:16px 18px;background:linear-gradient(180deg,#1c2230,#161b22);border-bottom:1px solid var(--line);gap:10px}
.mh-team{flex:1;text-align:center}.mh-team .nm{font-weight:700;font-size:14px}.mh-team .ow{color:var(--dim);font-size:11px}
.mh-team .sc{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.mh-vs{color:var(--dim);font-size:12px;font-weight:600}
.x{position:absolute;top:14px;right:16px;color:var(--dim);cursor:pointer;font-size:22px;line-height:1;background:none;border:none}
.wrap{position:relative}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
.col{padding:8px 0}.col+.col{border-left:1px solid var(--line)}
.sec{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 14px 4px}
.p{display:flex;align-items:center;gap:9px;padding:6px 12px}
.p:hover{background:var(--card2)}
.slot{width:34px;font-size:10px;font-weight:700;color:var(--dim);text-align:center;flex-shrink:0}
.hs{width:34px;height:34px;border-radius:50%;background:#22293a;object-fit:cover;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pline{color:#a9b6c8;font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{text-align:right;flex-shrink:0}
.pv{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.pp{color:var(--dim);font-size:10px}
.beat{color:var(--green)}.miss{color:var(--red)}
.inj{color:var(--gold);font-size:9px;font-weight:700;margin-left:4px}
.note{color:var(--dim);font-size:11px;text-align:center;padding:12px}
</style></head><body>

const hs=id=>`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`;
const dst=`https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png`;
const tn=id=>D.teams[id]||{name:'Team '+id,owner:''};
function row(p){
  const beat = p.proj!=null ? (p.pts>=p.proj?'beat':'miss') : '';
  const img = p.slot==='D/ST' ? dst : hs(p.id);
  return `<div class="p"><div class="slot">${p.slot}</div>
    <img class="hs" src="${img}" onerror="this.style.visibility='hidden'">
    <div class="pinfo"><div class="pn">${p.name}${p.inj&&p.inj!=='ACTIVE'?`<span class="inj">${p.inj[0]}</span>`:''}</div>
      <div class="pmeta">${p.pos} · ${p.pro}</div>
      ${p.line?`<div class="pline">${p.line}</div>`:''}</div>
    <div class="pts"><div class="pv ${beat}">${p.pts.toFixed(1)}</div>
      ${p.proj!=null?`<div class="pp">proj ${p.proj.toFixed(1)}</div>`:''}</div></div>`;
}
function col(side){
  return `<div class="col"><div class="sec">Starters</div>${side.starters.map(row).join('')}
    <div class="sec">Bench</div>${side.bench.map(row).join('')}</div>`;
}
function open_(i){
  const g=D.games[i], h=tn(g.home.teamId), a=tn(g.away.teamId);
  const hw=g.home.total>=g.away.total;
  document.getElementById('mbody').innerHTML=`
   <div class="mhead">
     <div class="mh-team"><div class="nm">${h.name}</div><div class="ow">${h.owner}</div><div class="sc ${hw?'win':''}">${g.home.total.toFixed(1)}</div></div>
     <div class="mh-vs">vs</div>
     <div class="mh-team"><div class="nm">${a.name}</div><div class="ow">${a.owner}</div><div class="sc ${!hw?'win':''}">${g.away.total.toFixed(1)}</div></div>
   </div>
   <div class="cols">${col(g.home)}${col(g.away)}</div>
   <div class="note">Headshots, logos, points, projections &amp; stat lines — all pulled live from ESPN.</div>`;
  document.getElementById('ov').classList.add('on');
}
function close_(){document.getElementById('ov').classList.remove('on')}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close_()};
document.getElementById('games').innerHTML=D.games.map((g,i)=>{
  const h=tn(g.home.teamId),a=tn(g.away.teamId),hw=g.home.total>=g.away.total;
  return `<div class="game" onclick="open_(${i})">
    <div class="g-side"><div><div class="g-name">${h.name}</div><div class="g-owner">${h.owner}</div></div></div>
    <div class="g-score ${hw?'win':''}">${g.home.total.toFixed(1)}</div>
    <div class="mid">–</div>
    <div class="g-score ${!hw?'win':''}">${g.away.total.toFixed(1)}</div>
    <div class="g-side away"><div><div class="g-name">${a.name}</div><div class="g-owner">${a.owner}</div></div></div>
    <div class="tag">box score ›</div></div>`;
}).join('');
</script></body></html>
