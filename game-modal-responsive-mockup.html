<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game modal v10</title><style>
:root{--field:#117a45;--field-dark:#0c5f35;--field-soft:#eaf5ef;--gold:#e3b940;--gold-soft:#fbf4d9;--ink:#15231c;--muted:#607069;--line:#d8e0dc;--line-strong:#b8c5bf;--surface:#fff;--canvas:#f4f7f5;--strength-bg:#eef1f0;--strength-fg:#7c8a84;--danger:#b42318;--sched:#3e6db5;--sched-soft:#eaf0f8;--live:#d64027;--live-soft:#fbe9e4;
--txs:13px;--tsm:14px;--tmd:15px;--t2xl:26px;--wm:550;--wb:700;--wk:850;--r:6px;--rp:999px;--shadow:0 8px 24px rgba(21,35,28,.12),0 24px 48px rgba(21,35,28,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#aeb9b4;font:var(--tsm)/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding-top:52px}
.demobar{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;background:#1e2622;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 12px;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:#33403a;border-radius:var(--rp);padding:2px}
.seg button{border:none;background:none;font:inherit;font-size:11px;font-weight:var(--wb);color:#94a49c;padding:4px 11px;border-radius:var(--rp);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink)}
.seglab{color:#94a49c;font-size:10px;font-weight:var(--wb);text-transform:uppercase;letter-spacing:.5px}
.stage{display:flex;align-items:center;justify-content:center;padding:18px 8px}
.frame{position:relative;background:var(--canvas);border:1px solid #99a49f;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.stage.device-mobile .frame{width:390px;height:800px;border-radius:30px}
.stage.device-tablet .frame{width:800px;height:700px}
.stage.device-desktop .frame{width:min(1080px,97vw);height:720px}
.fauxsched{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:9px;filter:blur(1px);opacity:.5}
.fauxsched .fr{height:52px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.backdrop{position:absolute;inset:0;background:rgba(21,35,28,.45)}
.panel{position:absolute;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.panel.mobile{inset:0}
.panel.modal{top:50%;left:50%;transform:translate(-50%,-50%);max-height:92%;border-radius:16px;box-shadow:var(--shadow)}
.stage.device-tablet .panel.modal{width:620px}
.stage.device-desktop .panel.modal{width:860px}
.appbar{display:flex;align-items:center;gap:6px;padding:10px 8px;border-bottom:1px solid var(--line);flex:none}
.iconbtn{border:none;background:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:20px}
.iconbtn:active{background:var(--strength-bg)}
.back{font-size:26px;line-height:1}
.apptitle{flex:1;text-align:center;font-size:var(--tmd);font-weight:var(--wb)}
.closeX{position:absolute;top:8px;right:8px;z-index:6;font-size:22px;color:var(--muted);background:var(--surface)}
.content{flex:1;display:flex;flex-direction:column;min-height:0}
.eyebrow{text-align:center;font-size:12px;font-weight:var(--wb);letter-spacing:.4px;text-transform:uppercase;color:var(--muted);padding:8px 8px;flex:none}
.eyebrow .dot{opacity:.5;margin:0 5px}
.stadlogo{width:24px;height:24px;object-fit:contain;vertical-align:-7px;margin-right:4px}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-bottom:1px solid var(--line);flex:none}
.tm{display:flex;flex-direction:column;row-gap:2px;padding:8px 12px 12px;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10%,#fff),#fff)}
.tm.away{align-items:flex-start;text-align:left}
.tm.home{align-items:flex-end;text-align:right}
.tm::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--acc)}
.st-upcoming .tm::after,.st-predraft .tm::after{background:repeating-linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 11px)}
.st-predraft .tm{filter:grayscale(.35);opacity:.92}
.tlogo{width:44px;height:44px;object-fit:contain;margin:3px 0 1px}
.rankrow{display:inline-flex;align-items:center;gap:4px;margin-bottom:2px;min-height:14px}
.tm.home .rankrow{flex-direction:row-reverse}
.trank{font-weight:var(--wk);font-size:9.5px;font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:var(--rp)}
.divmark{height:14px;padding:0 4px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:var(--wk);letter-spacing:.03em;color:#fff}
.tcity{font-size:10px;color:var(--muted);font-weight:var(--wm);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tnick{font-size:var(--tmd);font-weight:var(--wk);line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tsc{font-size:var(--t2xl);font-weight:var(--wk);font-variant-numeric:tabular-nums;line-height:1;margin-top:4px;white-space:nowrap}
.tsc.win{color:var(--field)}.tsc.lose{color:var(--muted)}.tsc.proj{font-size:20px;color:var(--muted);opacity:.55}.tsc.blank{color:var(--line-strong)}.tsc.live{color:var(--ink)}
.projtag{font-size:8px;font-weight:var(--wb);letter-spacing:.05em;color:var(--sched);background:var(--sched-soft);border-radius:var(--rp);padding:1px 5px;vertical-align:middle;margin:0 3px}
.livetag{font-size:8px;font-weight:var(--wb);letter-spacing:.05em;color:var(--live);background:var(--live-soft);border-radius:var(--rp);padding:1px 5px;vertical-align:middle;margin:0 3px}
.wp{font-size:9px;font-weight:var(--wb);color:#fff;background:var(--field);border-radius:var(--rp);padding:1px 5px;vertical-align:middle}
.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 6px 14px;text-align:center}
.atc{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:var(--wb);color:var(--muted);background:#fff}
.cstatus{font-size:10px;font-weight:var(--wk);letter-spacing:.06em;text-transform:uppercase;color:var(--field);display:inline-flex;align-items:center;gap:4px}
.cstatus.pre{color:var(--sched)}.cstatus.live{color:var(--live)}.cstatus.pd{color:var(--muted)}
.dot2{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ckick{font-size:9px;font-weight:var(--wb);color:var(--muted);margin-top:-3px}
.gchip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:var(--r);font-weight:var(--wb);font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;background:var(--field-soft);color:var(--field-dark)}
.gchip.gotw{background:var(--gold-soft);color:#6b5300}.gchip svg{width:10px;height:10px}
.sig{display:inline-flex;align-items:flex-end;gap:5px}.sig b{font-weight:var(--wk);font-size:var(--tmd);font-variant-numeric:tabular-nums;line-height:.9}
.bars{display:inline-flex;align-items:flex-end;gap:2px}.bars i{width:3px;border-radius:2px;background:#d5ddd9}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}
.bars.competitive i.on{background:var(--field)}.bars.neutral i.on{background:color-mix(in srgb,var(--field) 48%,var(--strength-fg))}.bars.lopsided i.on{background:var(--strength-fg)}
.sigmeta{font-size:9px;font-weight:var(--wb);color:var(--muted);font-variant-numeric:tabular-nums}
/* win probability */
.wpwrap{padding:9px 16px 11px;border-bottom:1px solid var(--line);flex:none}
.wprow{display:flex;align-items:center;gap:10px}
.wppct{font-size:14px;font-weight:var(--wk);font-variant-numeric:tabular-nums;min-width:38px}
.wppct.r{text-align:right}
.wpbar{flex:1;height:9px;border-radius:var(--rp);overflow:hidden;display:flex;background:var(--strength-bg)}
.wpbar i{height:100%}
.wpcap{text-align:center;font-size:9px;font-weight:var(--wb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.slabel{text-align:center;font-size:12px;font-weight:var(--wb);letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:7px 0 5px;background:var(--canvas);border-bottom:1px solid var(--line);flex:none}
.body{flex:1;overflow-y:auto;min-height:0}
.row{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:3px;padding:6px 8px;border-bottom:1px solid var(--line)}
.slot{text-align:center;font-size:9px;font-weight:var(--wb);border-radius:var(--r);padding:5px 0;letter-spacing:.2px}
.pl{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;border-radius:var(--r);padding:2px 4px}
.pl:active{background:var(--strength-bg)}.pl.a{flex-direction:row;text-align:right}.pl.empty{cursor:default}
.teampill{width:5px;height:22px;border-radius:var(--rp);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.panel.modal .teampill{width:6px;height:26px}
.panel.modal.dsk .teampill{width:7px;height:29px}
.teambadge{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:var(--wk);letter-spacing:.02em;color:#fff;text-shadow:0 1px 1.5px rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.teampill.blank{background:var(--strength-bg)!important;box-shadow:inset 0 0 0 1px var(--line)}
.txt{min-width:0;flex:1}
.pn{font-size:var(--txs);font-weight:var(--wm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn.blank{color:var(--line-strong);font-style:italic}
.pm{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm b{font-weight:var(--wb)}.opp{color:var(--line-strong);font-weight:var(--wm)}
.plstat{font-size:10px;color:var(--strength-fg);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{flex:none;min-width:52px;white-space:nowrap}.pl.h .pts{text-align:left}.pl.a .pts{text-align:right}
.act{font-size:var(--tmd);font-weight:var(--wb);font-variant-numeric:tabular-nums;line-height:1.05}
.act.beat{color:var(--field)}.act.proj{color:var(--muted);opacity:.55}.act.blank{color:var(--line-strong)}.act.live{color:var(--live)}
.pj{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}.pj.lab{letter-spacing:.04em}.pj.livelab{color:var(--live);font-weight:var(--wb)}
.det{grid-column:1/-1;display:none;padding:9px 12px 11px;border-radius:var(--r);margin:2px 4px 5px}.det.open{display:block}
.dh{display:flex;align-items:center;gap:8px;font-size:var(--txs);font-weight:var(--wb);margin-bottom:7px}
.dlogo{width:30px;height:30px;object-fit:contain;flex:none}.dh small{font-weight:var(--wm);color:var(--muted);font-size:10px}
.led .lr{display:flex;align-items:baseline;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line-strong)}.led .lr:last-child{border-bottom:none}
.lraw{min-width:34px;text-align:right;font-weight:var(--wb);font-variant-numeric:tabular-nums;font-size:var(--txs)}
.llab{flex:1;color:var(--ink);font-size:var(--txs)}
.lp{font-weight:var(--wb);font-variant-numeric:tabular-nums;font-size:var(--txs);min-width:50px;text-align:right}.lp.pos{color:var(--field-dark)}.lp.neg{color:var(--danger)}
.ltot{display:flex;justify-content:space-between;margin-top:5px;padding-top:6px;border-top:2px solid var(--line-strong);font-weight:var(--wk)}.ltot .tp{font-variant-numeric:tabular-nums}
.dmut{color:var(--muted);font-size:var(--txs);line-height:1.4}
.inj{color:var(--gold);font-size:8px;font-weight:var(--wb);margin-left:3px;vertical-align:top}
.bench .row{background:#fafcfb}
.foot{padding:9px;text-align:center;font-size:12px;color:var(--muted);background:var(--canvas);flex:none}
/* desktop comfort: use the real estate */
.dsk .content{font-size:15px}
.dsk .tlogo{width:56px;height:56px}
.dsk .tnick{font-size:19px}
.dsk .tcity{font-size:12px}
.dsk .tsc{font-size:32px}
.dsk .row{padding:9px 18px}
.dsk .pn{font-size:14px}
.dsk .pm{font-size:11px}
.dsk .act{font-size:16px}
.dsk .eyebrow{font-size:13px;padding:11px}
.dsk .wpwrap{padding:12px 40px 14px}
.dsk .wppct{font-size:17px}
.dsk .wpbar{height:11px}
/* ===== Game of the Week — dark broadcast style ===== */
.gotwband{display:none}
.gotw .gotwband{display:flex;align-items:center;justify-content:center;gap:9px;padding:7px 10px;background:linear-gradient(90deg,#b7902b,#f2cd55,#b7902b);color:#2a2205;font-weight:var(--wk);font-size:11px;letter-spacing:.16em;text-transform:uppercase;flex:none}
.gotw .gotwband svg{width:12px;height:12px;fill:#2a2205}
.panel.gotw{background:radial-gradient(135% 95% at 50% -12%,#243129 0%,#141b18 52%,#0b0f0d 100%);color:#eef3f1}
.gotw .content{color:#eef3f1}
.gotw .eyebrow{color:#9fb0a8}
.gotw .appbar{border-bottom-color:rgba(255,255,255,.10)}
.gotw .apptitle{color:#f1f5f3}.gotw .iconbtn{color:#eef3f1}.gotw .closeX{background:transparent;color:#cdd8d2}
.gotw .hd{border-bottom-color:rgba(255,255,255,.12)}
.gotw .tm{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 32%,transparent),transparent)}
.gotw .tm::after{box-shadow:0 0 14px 1px var(--acc)}
.gotw .tnick{color:#fff}.gotw .tcity{color:#a7b6ae}
.gotw .tsc{color:#eef3f1}.gotw .tsc.win{color:var(--gold);text-shadow:0 0 18px rgba(227,185,64,.5)}.gotw .tsc.lose{color:#8a998f}
.gotw .wp{background:var(--gold);color:#2a2205}
.gotw .atc{background:transparent;border-color:rgba(255,255,255,.35);color:#eef3f1}
.gotw .cstatus{color:var(--gold)}.gotw .sig b{color:#eef3f1}.gotw .sigmeta{color:#a7b6ae}.gotw .ckick{color:#a7b6ae}
.gotw .gchip.gotw{background:linear-gradient(90deg,#c9a030,#e3b940);color:#2a2205;box-shadow:0 0 12px rgba(227,185,64,.4)}
.gotw .wpwrap{border-bottom-color:rgba(255,255,255,.12)}.gotw .wpbar{background:rgba(255,255,255,.13);overflow:visible}.gotw .wpcap{color:#a7b6ae}
.gotw .wpbar i:first-child{border-radius:9px 0 0 9px}.gotw .wpbar i:last-child{border-radius:0 9px 9px 0}
.gotw .slabel{background:transparent;color:var(--gold);border-bottom-color:rgba(255,255,255,.10);letter-spacing:.14em}
.gotw .row{border-bottom-color:rgba(255,255,255,.07)}.gotw .bench .row{background:rgba(255,255,255,.03)}
.gotw .pn{color:#f1f5f3}.gotw .pm{color:#9fb0a8}.gotw .opp{color:#809087}.gotw .plstat{color:#8fa79b}
.gotw .act{color:#f1f5f3}.gotw .act.proj{color:#9fb0a8}.gotw .pj{color:#9fb0a8}
.gotw .slot{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.gotw .teambadge{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.gotw .foot{background:transparent;color:#8a9a92;border-top:1px solid rgba(255,255,255,.06)}
.gotw .det .dh{color:#f1f5f3}.gotw .det .dh small{color:#a7b6ae}
.gotw .det .lraw,.gotw .det .llab,.gotw .det .ltot,.gotw .det .tp{color:#eef3f1}
.gotw .det .lr{border-bottom-color:rgba(255,255,255,.14)}.gotw .det .ltot{border-top-color:rgba(255,255,255,.3)}
.gotw .det .lp.pos{color:#5fd08a}.gotw .det .dmut{color:#a7b6ae}
/* ===== week strip (mini live previews) ===== */
.wkstrip{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;scroll-snap-type:x proximity}
.wkstrip::-webkit-scrollbar{display:none}
.wkcard{flex:none;width:182px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px 7px;cursor:pointer;text-align:left;font:inherit;color:inherit;scroll-snap-align:center}
.wkab{flex:1;min-width:0}
.wkcard.on{border-color:var(--field);box-shadow:0 0 0 1px var(--field)}
.wktop{display:flex;justify-content:flex-end;margin-bottom:2px;min-height:11px}
.wkstar{color:#a07d13;font-size:8px;font-weight:var(--wk);letter-spacing:.04em}
.wknum{color:var(--muted);font-size:8px;font-weight:var(--wb);letter-spacing:.04em;text-transform:uppercase}
.wkteam{display:flex;align-items:center;gap:5px;font-size:11px;padding:1px 0}
.wkteam img{width:16px;height:16px;object-fit:contain;flex:none}
.wkab{font-weight:var(--wb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkrk{color:var(--muted);font-size:8px;font-weight:var(--wb);flex:none}
.wkteam b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:var(--wk);flex:none}
.wkteam b.w{color:var(--field)}
.gotw .wkstrip{border-bottom-color:rgba(255,255,255,.12)}
.gotw .wkcard{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.13);color:#eef3f1}
.gotw .wkcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.gotw .wkrk,.gotw .wknum{color:#9fb0a8}.gotw .wkstar{color:var(--gold)}.gotw .wkteam b.w{color:var(--gold)}
.wkcard.gotw-c{border-color:var(--gold)}.wkcard.on{border-color:var(--field);box-shadow:0 0 0 1px var(--field)}
/* mobile mini strip — logos + scores only, ultra thin */
.wkstrip.mini{padding:5px 10px;gap:6px;scrollbar-width:none}
.wkstrip.mini::-webkit-scrollbar{display:none}
.wkstrip.mini .wkcard{width:auto;display:flex;align-items:center;gap:7px;padding:3px 9px;border-radius:8px}
.mlabel{font-size:8.5px;font-weight:var(--wk);color:var(--muted);letter-spacing:.03em;flex:none}
.mlabel.star{color:#a07d13;font-size:10px}
.gotw .mlabel{color:#9fb0a8}.gotw .mlabel.star{color:var(--gold)}
.mat{font-size:8px;font-weight:var(--wb);color:var(--line-strong)}
.gotw .mat{color:#6a7a72}
.mteam{display:inline-flex;align-items:center;gap:4px}
.mteam img{width:15px;height:15px;object-fit:contain;flex:none}
.mteam b{font-size:11px;font-variant-numeric:tabular-nums;font-weight:var(--wk)}
.mteam b.w{color:var(--field)}
.gotw .mteam b.w{color:var(--gold)}

/* ===== collapse-on-scroll header ===== */
.wkstrip,.gotwband,.eyebrow,.wpwrap{transition:max-height .3s ease,padding .3s ease,opacity .22s ease,border-color .3s ease;overflow:hidden}
.wkstrip{max-height:150px}.gotwband{max-height:46px}.eyebrow{max-height:50px}.wpwrap{max-height:96px}
.collapsed .wkstrip{max-height:0;padding-top:0;padding-bottom:0;opacity:0;border-bottom-color:transparent}
.collapsed .gotwband{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
.collapsed .eyebrow{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
.collapsed .wpwrap{max-height:0;padding-top:0;padding-bottom:0;opacity:0;border-bottom-color:transparent}
.tm{transition:padding .3s ease}.tlogo,.tsc,.tnick{transition:width .28s ease,height .28s ease,font-size .28s ease,margin .28s ease}
.collapsed .tm{padding-top:6px;padding-bottom:9px}
.collapsed .tlogo{width:26px;height:26px;margin:1px 0}
.collapsed .rankrow{display:none}.collapsed .tcity{display:none}
.collapsed .tnick{font-size:13px}
.collapsed .tsc{font-size:18px;margin-top:2px}
.ctr{transition:padding .3s ease}.collapsed .ctr{padding:5px 6px 7px;gap:3px}
.collapsed .sig,.collapsed .sigmeta,.collapsed .gchip,.collapsed .ckick{display:none}
.dsk .collapsed .tlogo{width:34px;height:34px}.dsk .collapsed .tnick{font-size:15px}.dsk .collapsed .tsc{font-size:22px}

</style></head><body>
<div class="demobar">
  <span class="seglab">Device</span>
  <div class="seg" id="dev"><button data-d="mobile">Mobile</button><button data-d="tablet">Tablet</button><button data-d="desktop">Desktop</button></div>
  <span class="seglab">State</span>
  <div class="seg" id="st"><button data-s="predraft">Pre-Draft</button><button data-s="upcoming">Upcoming</button><button data-s="live">Live</button><button data-s="final">Final</button></div>
  <span class="seglab">Style</span>
  <div class="seg" id="stl"><button data-l="standard">Standard</button><button data-l="gotw">GOTW</button></div>
</div>

  const chip=(g.gotw||STYLE==='gotw')?`<span class="gchip gotw">${STAR}GOTW</span>`:`<span class="gchip">Game ${g.num}</span>`;
  const bars=[1,2,3].map(n=>`<i class="${(4-n)<=g.bars?'on':''}"></i>`).join('');
  const rating=STATE==='predraft'?'':`<div class="sig"><b>${g.rating.toFixed(1)}</b><span class="bars ${g.label.toLowerCase()}">${bars}</span></div><div class="sigmeta">#${g.aRank} vs #${g.hRank}</div>`;
  return `<div class="ctr"><div class="atc">at</div>${status}${rating}</div>`;
}
function wpBar(){
  const wp=winProb(); if(!wp) return '';
  const aAcc=T[G.away.teamId].accent, hAcc=T[G.home.teamId].accent;
  const gl=(G.game.gotw||STYLE==='gotw');
  const ga=gl?`;box-shadow:0 0 10px ${aAcc}`:'', gh=gl?`;box-shadow:0 0 10px ${hAcc}`:'';
  return `<div class="wpwrap"><div class="wprow">
    <span class="wppct" style="color:${aAcc}">${wp.a}%</span>
    <div class="wpbar"><i style="width:${wp.a}%;background:${aAcc}${ga}"></i><i style="width:${wp.h}%;background:${hAcc}${gh}"></i></div>
    <span class="wppct r" style="color:${hAcc}">${wp.h}%</span>
   </div><div class="wpcap">${wp.cap}</div></div>`;
}
function contentHTML(){
  const hs=G.home.starters,as=G.away.starters,hb=G.home.bench,ab=G.away.bench;
  const empty=STATE==='predraft';
  let rows=''; for(let i=0;i<Math.max(hs.length,as.length);i++) rows+=rowStarter(as[i],hs[i],i,empty);
  let bench=''; for(let i=0;i<Math.max(hb.length,ab.length);i++) bench+=rowBench(ab[i],hb[i],i,empty);
  const foot={predraft:'Draft not held yet · roster slots reserved',upcoming:'Set your lineup · projections shown until kickoff',live:'Live scoring · tap a player for their box score',final:'Tap any player to see how their points were scored'}[STATE];
  const band=(G.game.gotw||STYLE==='gotw')?`<div class="gotwband">${STAR} Game of the Week ${STAR}</div>`:'';
  return `<div class="content">${weekStrip()}${band}
    <div class="eyebrow">Wk ${G.game.week}<span class="dot">·</span>${G.game.date.replace(/,?\s*\d{4}$/,'')}<span class="dot">·</span><img class="stadlogo" src="${T[G.home.teamId].logo||AV}" onerror="this.src='${AV}'">${G.game.stadium}</div>
    <div class="hd">${teamHead(G.away,'away')}${centerCol()}${teamHead(G.home,'home')}</div>
    ${wpBar()}
    <div class="slabel">Starters</div>
    <div class="body"><div class="rosters">${rows}</div><div class="slabel">Bench</div><div class="bench rosters">${bench}</div>
      <div class="foot">${foot}</div></div></div>`;
}
function frameHTML(){
  const c=contentHTML();
  const gc=(G.game.gotw||STYLE==='gotw')?'gotw':'';
  if(DEVICE==='mobile') return `<div class="frame"><div class="panel mobile st-${STATE} ${gc}">
    <div class="appbar"><button class="iconbtn back" title="Back to schedule">‹</button><div class="apptitle">Matchup</div><button class="iconbtn" title="Share">⤴</button></div>
    ${c}</div></div>`;
  const dsk=DEVICE==='desktop'?'dsk':'';
  return `<div class="frame"><div class="fauxsched">${'<div class="fr"></div>'.repeat(9)}</div><div class="backdrop"></div>
    <div class="panel modal st-${STATE} ${dsk} ${gc}"><button class="iconbtn closeX" title="Close">×</button>${c}</div></div>`;
}

function stripTotal(g,sd){
  if(STATE==='predraft') return null;
  if(STATE==='final') return sd.total;
  if(STATE==='upcoming') return sd.starters.reduce((a,p)=>a+(p.proj||0),0);
  return sd.starters.reduce((a,p,i)=>a+(pstat(i)==='final'?p.pts:pstat(i)==='live'?livePts(p):(p.proj||0)),0);
}
function weekStrip(){
  const mini=DEVICE==='mobile';
  return `<div class="wkstrip ${mini?'mini':''}">`+GAMES.map((g,i)=>{
    const a=T[g.away.teamId],h=T[g.home.teamId];
    const at=stripTotal(g,g.away),ht=stripTotal(g,g.home);
    const as=at==null?'—':at.toFixed(1), hs=ht==null?'—':ht.toFixed(1);
    const aw=STATE==='final'&&g.away.total>g.home.total, hw=STATE==='final'&&g.home.total>=g.away.total;
    const cls=`wkcard ${i===GAMEIDX?'on':''} ${g.game.gotw?'gotw-c':''}`;
    const img=u=>`<img src="${u||AV}" onerror="this.src='${AV}'">`;
    if(mini){const lab=g.game.gotw?`<span class="mlabel star">★</span>`:`<span class="mlabel">G${g.game.num}</span>`;
      return `<button class="${cls}" data-g="${i}">${lab}<span class="mteam">${img(a.logo)}<b class="${aw?'w':''}">${as}</b></span><span class="mat">at</span><span class="mteam">${img(h.logo)}<b class="${hw?'w':''}">${hs}</b></span></button>`;}
    const tag=g.game.gotw?`<span class="wkstar">★ GOTW</span>`:`<span class="wknum">Game ${g.game.num}</span>`;
    return `<button class="${cls}" data-g="${i}"><div class="wktop">${tag}</div>`+
      `<div class="wkteam">${img(a.logo)}<span class="wkab">${a.nick||''}</span><span class="wkrk">#${a.rank}</span><b class="${aw?'w':''}">${as}</b></div>`+
      `<div class="wkteam">${img(h.logo)}<span class="wkab">${h.nick||''}</span><span class="wkrk">#${h.rank}</span><b class="${hw?'w':''}">${hs}</b></div></button>`;
  }).join('')+`</div>`;
}
function setGame(i){ i=(i+GAMES.length)%GAMES.length; GAMEIDX=i; G=GAMES[i]; paint(); const on=document.querySelector('.wkcard.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'}); }

const stage=document.getElementById('stage');
function paint(){
  stage.className='stage device-'+DEVICE;
  stage.innerHTML=frameHTML();
  const _body=stage.querySelector('.body'); if(_body){_body.addEventListener('scroll',()=>{const c=stage.querySelector('.content'); if(c) c.classList.toggle('collapsed', _body.scrollTop>18);});}
  document.querySelectorAll('#dev button').forEach(b=>b.classList.toggle('on',b.dataset.d===DEVICE));
  document.querySelectorAll('#st button').forEach(b=>b.classList.toggle('on',b.dataset.s===STATE));
  document.querySelectorAll('#stl button').forEach(b=>b.classList.toggle('on',b.dataset.l===STYLE));
}
document.getElementById('dev').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;DEVICE=b.dataset.d;paint();});
document.getElementById('st').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;STATE=b.dataset.s;paint();});
document.getElementById('stl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;STYLE=b.dataset.l;paint();});
stage.addEventListener('click',e=>{const c=e.target.closest('.wkcard'); if(c) setGame(+c.dataset.g);});
let _tsx=0,_tsy=0;
stage.addEventListener('touchstart',e=>{_tsx=e.touches[0].clientX;_tsy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-_tsx,dy=e.changedTouches[0].clientY-_tsy; if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4) setGame(GAMEIDX+(dx<0?1:-1));},{passive:true});
stage.addEventListener('click',e=>{
  const pl=e.target.closest('.pl'); if(!pl||pl.classList.contains('empty'))return;
  const k=pl.dataset.k, d=document.getElementById('d-'+k); if(!d)return;
  const wasOpen=d.classList.contains('open');
  stage.querySelectorAll('.det.open').forEach(n=>n.classList.remove('open'));
  if(!wasOpen){const p=store[k],t=T[p.ft];d.innerHTML=detail(p);d.style.background=(G.game.gotw||STYLE==='gotw')?`linear-gradient(90deg, ${t.accent}55, rgba(255,255,255,.05))`:`linear-gradient(90deg, ${tint(t.accent)}, ${t.accent}0d)`;d.classList.add('open');}
});
paint();
</script></body></html>
